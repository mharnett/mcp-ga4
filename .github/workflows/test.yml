name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Windows leg weekly (and on demand) instead of on every push — see the
  # matrix comment below and ci-matrix.guard.test.mjs.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

# Supersede stale PR runs; never cancel a run on main, so every merge keeps
# its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows bills ~2x Linux. Ordinary pushes/PRs run Linux only;
        # schedule, dispatch and release-please PRs (the build about to be
        # published) run both. Pinned by ci-matrix.guard.test.mjs.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v7

      - name: Checkout mcp-test-harness
        uses: actions/checkout@v7
        with:
          repository: mharnett/mcp-test-harness
          token: ${{ secrets.GH_PAT }}
          path: mcp-test-harness

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Build mcp-test-harness
        working-directory: mcp-test-harness
        run: npm install && npm run build

      - run: npm ci
      - run: npm run build
      - run: npm test
